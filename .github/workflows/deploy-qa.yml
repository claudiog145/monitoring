# Manual QA deploy for both Container Apps.
# The work (test, image build, ACR push, Container App update) lives in shared-workflows.
# This file only names this repo's projects and apps, plus the Functions settings job below.
#
# Actions tab → Deploy QA → Run workflow. Pick the branch to deploy (use main).
# Nothing runs on merge.

name: Deploy QA

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

# One QA deploy at a time; a second run waits instead of racing the first.
concurrency:
  group: deploy-qa
  cancel-in-progress: false

jobs:
  web:
    name: Web
    uses: arriviainc-softeng/shared-workflows/.github/workflows/dotnet-docker-build-test-release.yml@main
    secrets: inherit
    with:
      dotnet-version: "10.0.x"
      project-path: Portal/src/JourneyMonitor.Web/JourneyMonitor.Web.csproj
      dockerfile: Portal/src/JourneyMonitor.Web/Dockerfile
      docker-context: Portal
      image-name: journeymonitor-web
      container-app-name: platform-reliability-ca-wa-qa
      environments: |
        - qa

  # Spec 1000. Runs BEFORE the image swap: the new image binds its timers to
  # %spec1000_ingestion_cron% / %spec1000_monitor_cron% / %spec1000_token_refresh_cron%, and the host fails indexing (every
  # function down) if a revision starts without them. Settings are added only when missing, so a
  # value changed in Azure (e.g. HealthMonitoring__Enabled=true for shadow mode) is never
  # overwritten; safe defaults are Enabled=false, Triage__Mode=Shadow. It also pins
  # --min-replicas 1 so the timers keep firing (maxReplicas keeps its value, 1 when unset).
  # The shared workflow's `az containerapp update --image` keeps both env vars and scale.
  # Optional: it needs its own identity (the shared workflow only has the ACR push identity), so
  # it runs only when the repository variable SPEC1000_AZURE_CLIENT_ID is set. While it is not,
  # the job is skipped and `functions` still deploys; apply the settings once with
  # Portal/scripts/publish-func-qa.ps1 (see Portal/PUBLISHING.md). If it runs and FAILS,
  # `functions` does not run, so an image never starts without its settings.
  functions-settings:
    name: Functions settings + always-on
    if: ${{ vars.SPEC1000_AZURE_CLIENT_ID != '' }}
    runs-on: ubuntu-latest
    environment: qa
    env:
      CONTAINER_APP: platform-reliability-ca-func-qa
      RESOURCE_GROUP: platform-reliability-rg-qa
    steps:
      # TODO confirmar: SPEC1000_AZURE_CLIENT_ID / SPEC1000_AZURE_SUBSCRIPTION_ID are repository
      # variables for an identity with Contributor on the Functions Container App, with a federated
      # credential for this repo's `qa` environment. ARRIVIA_AZURE_TENANT_ID is the org variable
      # the shared workflow already uses.
      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ vars.SPEC1000_AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.ARRIVIA_AZURE_TENANT_ID }}
          subscription-id: ${{ vars.SPEC1000_AZURE_SUBSCRIPTION_ID }}

      - name: Add missing Spec 1000 settings and pin min replicas
        shell: bash
        run: |
          set -euo pipefail
          existing="$(az containerapp show --name "$CONTAINER_APP" --resource-group "$RESOURCE_GROUP" \
            --query "properties.template.containers[0].env[].name" --output tsv)"
          max="$(az containerapp show --name "$CONTAINER_APP" --resource-group "$RESOURCE_GROUP" \
            --query "properties.template.scale.maxReplicas" --output tsv)"
          if ! [[ "$max" =~ ^[0-9]+$ ]] || [ "$max" -lt 1 ]; then max=1; fi

          missing=()
          add_if_missing() {
            if ! grep -qxF "$1" <<< "$existing"; then missing+=("$1=$2"); fi
          }
          add_if_missing spec1000_ingestion_cron "0 */1 * * * *"
          add_if_missing spec1000_monitor_cron "30 */1 * * * *"
          add_if_missing spec1000_token_refresh_cron "0 */5 * * * *"
          add_if_missing HealthMonitoring__Enabled "false"
          add_if_missing Triage__Mode "Shadow"

          env_args=()
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "Adding Spec 1000 settings: ${missing[*]}"
            env_args=(--set-env-vars "${missing[@]}")
          fi

          az containerapp update --name "$CONTAINER_APP" --resource-group "$RESOURCE_GROUP" \
            --min-replicas 1 --max-replicas "$max" "${env_args[@]}" \
            --query "{revision:properties.latestRevisionName, scale:properties.template.scale}" --output json

  functions:
    name: Functions
    needs: functions-settings
    if: ${{ !failure() && !cancelled() }}
    uses: arriviainc-softeng/shared-workflows/.github/workflows/dotnet-docker-build-test-release.yml@main
    secrets: inherit
    with:
      dotnet-version: "10.0.x"
      project-path: Portal/src/JourneyMonitor.Functions/JourneyMonitor.Functions.csproj
      dockerfile: Portal/src/JourneyMonitor.Functions/Dockerfile
      docker-context: Portal
      image-name: journeymonitor-functions
      container-app-name: platform-reliability-ca-func-qa
      environments: |
        - qa
